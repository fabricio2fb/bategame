services:
  - type: web
    name: bateprimeiro-socket
    runtime: node
    rootDir: .
    buildCommand: npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URLS
        value: https://bateprimeiro.vercel.app
